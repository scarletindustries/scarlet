[package]
name = "scarlet_vm"
version = "0.1.0"
edition = "2024"

[dependencies]
scarlet_ir = { path = "../scarlet_ir" }
# Big ints' arithmetic, behind `bigint.rs` (docs/vm-design.md, "Values").
num-bigint = "0.5"
num-traits = "0.2"
# `string.to_graphemes`: the extended grapheme clusters of UAX #29.
unicode-segmentation = "1"

[dev-dependencies]
# Tests write their programs in Scarlet and compile them. Only the tests see
# the compiler; the VM itself reads nothing but `scarlet_ir`.
scarlet_core = { path = "../scarlet_core" }
