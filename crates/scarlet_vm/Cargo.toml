[package]
name = "scarlet_vm"
version = "0.1.0"
edition = "2024"

[dependencies]
scarlet_ir = { path = "../scarlet_ir" }
# Big ints' arithmetic, behind `bigint.rs` (docs/vm-design.md, "Values").
num-bigint = "0.5"
num-traits = "0.2"
# `string.to_graphemes`: the extended grapheme clusters of UAX #29.
unicode-segmentation = "1"
# `crypto.random_bytes`: the OS's own random source.
getrandom = "0.4"
# `scarlet/crypto`'s digests, HMAC and signature checks: aws-lc, the crypto
# rustls links for TLS. Without the default `ring-io` and `ring-sig-verify`,
# which only add `ring`-shaped APIs this does not call.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "alloc"] }
# The OS error numbers `scarlet/io.IoError` names.
libc = "0.2"
# `scarlet/json`'s parser: simdjson's Rust port, choosing its SIMD code for
# the CPU it runs on. Without the default `serde_impl`, which pulls serde in
# for an API this never calls; `swar-number-parsing` is a default it does use.
simd-json = { version = "0.17", default-features = false, features = ["runtime-detection", "swar-number-parsing"] }
# Finding the next backslash, for the lone-surrogate check in `json.rs`.
memchr = "2"
# `scarlet/http/h1`'s head parser: `hyper`'s, SIMD and allocation-free.
httparse = "1"

[dev-dependencies]
# Tests write their programs in Scarlet and compile them. Only the tests see
# the compiler; the VM itself reads nothing but `scarlet_ir`.
scarlet_core = { path = "../scarlet_core" }
