[package]
name = "scarlet_vm"
version = "0.1.0"
edition = "2024"

[dependencies]
scarlet_ir = { path = "../scarlet_ir" }
# Does big-int arithmetic behind `bigint.rs` (docs/vm-design.md, "Values").
num-bigint = "0.5"
num-traits = "0.2"
# Splits text into UAX #29 extended grapheme clusters for `string.to_graphemes`.
unicode-segmentation = "1"
# Reads the OS's own random source for `crypto.random_bytes`.
getrandom = "0.4"
# Does `scarlet/crypto`'s digests, HMAC and signature checks with aws-lc, the
# crypto rustls links for TLS. We turn off the default `ring-io` and
# `ring-sig-verify` features, which only add `ring`-shaped APIs we don't call.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "alloc"] }
# Gives the OS error numbers that `scarlet/io.IoError` names.
libc = "0.2"
# Parses JSON for `scarlet/json`. It's simdjson's Rust port, and it picks its
# SIMD code for the CPU it runs on. We turn off the default `serde_impl`, which
# pulls in serde for an API we never call, but keep the default
# `swar-number-parsing`, which we do use.
simd-json = { version = "0.17", default-features = false, features = ["runtime-detection", "swar-number-parsing"] }
# Finds the next backslash, for the lone-surrogate check in `json.rs`.
memchr = "2"
# Parses HTTP heads for `scarlet/http/h1`. It's `hyper`'s parser, uses SIMD and
# doesn't allocate.
httparse = "1"

[dev-dependencies]
# Tests write their programs in Scarlet and compile them. Only the tests see
# the compiler, and the VM itself reads nothing but `scarlet_ir`.
scarlet_core = { path = "../scarlet_core" }
