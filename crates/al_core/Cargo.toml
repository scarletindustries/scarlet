[package]
name = "al_core"
version = "0.1.0"
edition = "2024"

[features]
# Forwarded to `al_vm` — see its manifest. Kept here so a dependant can turn
# the counter on through either crate.
alloc-counter = ["al_vm/alloc-counter"]

[dependencies]
al_syntax = { path = "../al_syntax" }
al_types = { path = "../al_types" }
al_vm = { path = "../al_vm" }
indexmap = { workspace = true }
cranelift-codegen = { workspace = true }
cranelift-frontend = { workspace = true }
cranelift-module = { workspace = true }
cranelift-jit = { workspace = true }
cranelift-native = { workspace = true }
smallvec = "1.15"
petgraph = "0.8"
include_dir = { version = "0.7", features = ["glob"] }
percent-encoding = "2"
