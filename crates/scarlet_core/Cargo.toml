[package]
name = "scarlet_core"
version = "0.1.0"
edition = "2024"


# `cargo mordant` sets `--cfg mordant` and plain cargo doesn't, so every
# other build sees the `#[cfg_attr(mordant, ...)]` suppression on `Compiler`
# as an unexpected cfg, and `clippy -- -D warnings` fails on it.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mordant)'] }

[dependencies]
scarlet_syntax = { path = "../scarlet_syntax" }
scarlet_ir = { path = "../scarlet_ir" }
scarlet_types = { path = "../scarlet_types" }
scarlet_elaborate = { path = "../scarlet_elaborate" }
scarlet_lower = { path = "../scarlet_lower" }
indexmap = { workspace = true }
smallvec = "1.15"
petgraph = "0.8"
include_dir = { version = "0.7", features = ["glob"] }
percent-encoding = "2"
