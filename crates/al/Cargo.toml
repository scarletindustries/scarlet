[package]
name = "al"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
al_core = { path = "../al_core" }
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.3"
polling = "3"
rustyline = "14"
serde_json = "1"
indexmap = { workspace = true }
ureq = "2"

[build-dependencies]
al_core = { path = "../al_core" }

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "al"
path = "src/main.rs"
