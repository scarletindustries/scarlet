name: CI

on:
  push:
    branches-ignore:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The GC stress gate: AL_GC_STRESS=1 makes every allocation safepoint
      # collect, so a value held in a Rust local across an allocation — a
      # rooting-rule violation — fails deterministically instead of
      # corrupting memory intermittently.
      - name: Test (GC stress)
        run: AL_GC_STRESS=1 cargo test --workspace
