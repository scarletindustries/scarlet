name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  grammar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/tree-sitter-scarlet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install

      # src/ is committed because grammar consumers build from it; editing
      # grammar.js without regenerating must fail here. lexical.js is read by
      # this step but never written by it, so a stale copy regenerates a
      # matching src/ and this diff stays clean. It comes from
      # crates/scarlet_syntax and is gated in the `test` job by xtask's
      # generated_files_are_up_to_date — `cargo xtask gen-editor-syntax --check`.
      - name: Generated parser is current
        run: bun run generate && git diff --exit-code src grammar.js

      # The grammar-vs-parser sync check: every .scrl the compiler's own
      # corpus accepts must parse without an error node.
      - name: Corpus
        run: bun run corpus

  # Dead-code gate: hawk treats the workspace as a closed world and fails on
  # `pub` items nothing reachable from the `scarlet` binary uses. It links
  # against rustc internals, so this pinned release must match the Rust
  # version in rust-toolchain.toml — bump them together.
  hawk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install hawk
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/astral-sh/hawk/releases/download/0.1.12/cargo-hawk-installer.sh | sh

      - name: Hawk
        run: cargo hawk check -D warnings

  # Type-hardening gate: mordant's lints fire only on provable claims, and any
  # finding fails the job; to keep one, `#[expect]` it where it is, with the
  # reason. Tests are part of the run so that what they use counts for
  # `unused_pub`; they are not linted. Mordant is pinned to a rev, so the gate
  # only changes when this line does, and runs on the nightly it was built
  # with; the workspace toolchain is untouched. Bump the two together.
  mordant:
    runs-on: ubuntu-latest
    env:
      MORDANT_REV: cbeefdb06cd5ee5989196a3e836e5a85f4ca6bed
      MORDANT_TOOLCHAIN: nightly-2026-09-01
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install mordant's nightly
        run: rustup toolchain install "$MORDANT_TOOLCHAIN" --profile minimal --component rustc-dev --component llvm-tools-preview

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Cache mordant
        id: mordant-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-mordant
            ~/.cargo/bin/mordant-driver
          key: mordant-${{ runner.os }}-${{ env.MORDANT_REV }}

      - name: Install mordant
        if: steps.mordant-cache.outputs.cache-hit != 'true'
        run: cargo +"$MORDANT_TOOLCHAIN" install --locked --git https://github.com/scarletindustries/mordant --rev "$MORDANT_REV"

      - name: Mordant
        run: cargo mordant --workspace --all-targets
        env:
          MORDANT_RUSTFLAGS: -D warnings
