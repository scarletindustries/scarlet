name: Release

# Run by hand from the Actions tab: "Run workflow", then canary or stable.
#
# The next version comes from the change files in `.changeset/`, which knope
# reads (`knope.toml`). A stable release bumps VERSION, writes CHANGELOG.md,
# deletes the change files, commits `release <version>`, tags `v<version>` and
# pushes both, then builds from that tag. A canary previews the next version
# and builds `<version>-canary.<date>` from the commit it ran on, committing
# nothing.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "canary"
        type: choice
        options:
          - canary
          - stable

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_canary: ${{ steps.version.outputs.is_canary }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install knope
        uses: knope-dev/action@v2.1.2
        with:
          version: 0.23.0

      - name: Determine version
        id: version
        run: |
          if [ "${{ inputs.release_type }}" = "stable" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Fails, and so stops the release, when there is no change file.
            knope release
            VERSION=$(cat VERSION)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
            echo "is_canary=false" >> $GITHUB_OUTPUT
            echo "ref=v$VERSION" >> $GITHUB_OUTPUT
          else
            knope preview
            VERSION="$(cat VERSION)-canary.$(date -u +%Y%m%d.%H%M)"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$VERSION" >> $GITHUB_OUTPUT
            echo "is_canary=true" >> $GITHUB_OUTPUT
            echo "ref=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

  build:
    needs: version
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos
            target: aarch64-apple-darwin
            asset: scarlet-macos-arm64
          - os: macos-latest
            platform: macos
            target: x86_64-apple-darwin
            asset: scarlet-macos-x86_64
          - os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
            asset: scarlet-linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux
            target: aarch64-unknown-linux-gnu
            asset: scarlet-linux-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Published stamp. `crates/scarlet/build.rs` uses this as-is because it
      # already contains `-canary.`; a local `cargo build` leaves VERSION as
      # `0.0.1` and appends `+git.<sha>` so `--version` can name the commit.
      - name: Update VERSION file
        run: echo "${{ needs.version.outputs.version }}" > VERSION

      - name: Build (Release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run Tests
        run: cargo test --release --target ${{ matrix.target }}

      - name: Prepare Release Binary
        run: |
          cp "target/${{ matrix.target }}/release/scarlet" "./${{ matrix.asset }}"

      - name: Import Code Signing Certificate
        if: matrix.platform == 'macos'
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Sign Binary
        if: matrix.platform == 'macos'
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          # --options runtime without entitlements SIGKILLs the JIT the moment it
          # maps an executable page, so the entitlements file is load-bearing for
          # every macOS release. Do not add XML comments to it: AMFI's parser
          # rejects them ("AMFIUnserializeXML: syntax error") even though
          # `plutil -lint` accepts the file.
          codesign --sign "$CODESIGN_IDENTITY" \
            --options runtime \
            --entitlements .github/entitlements/macos-jit.plist \
            --timestamp \
            --force \
            ./${{ matrix.asset }}

          codesign -vv -d ./${{ matrix.asset }}

          # A successful `codesign --sign` does not prove the grants reached the
          # signature, and without them the hardened runtime SIGKILLs the JIT.
          # Assert against the signed binary, not against the flag we passed.
          entitlements=$(codesign -d --entitlements - --xml ./${{ matrix.asset }} 2>/dev/null)
          for key in com.apple.security.cs.allow-jit \
                     com.apple.security.cs.allow-unsigned-executable-memory; do
            case "$entitlements" in
              *"$key"*) ;;
              *) echo "::error::signed binary is missing $key"; exit 1 ;;
            esac
          done

      - name: Notarize Binary
        if: matrix.platform == 'macos'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          zip -r scarlet.zip ./${{ matrix.asset }}

          xcrun notarytool store-credentials "notary-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

          xcrun notarytool submit scarlet.zip \
            --keychain-profile "notary-profile" \
            --wait

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ./${{ matrix.asset }}

      - name: Cleanup Keychain
        if: always() && matrix.platform == 'macos'
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare binaries
        run: |
          mkdir -p release
          find artifacts -type f -name 'scarlet-*' -exec mv {} release/ \;
          chmod +x release/*
          ls -la release/

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          TAG="${{ needs.version.outputs.tag }}"
          IS_CANARY="${{ needs.version.outputs.is_canary }}"

          if [ "$IS_CANARY" = "true" ]; then
            gh release create "$TAG" \
              --repo ${{ github.repository }} \
              --title "Canary ($VERSION)" \
              --notes "Automated canary build.

          **Version:** $VERSION
          **Commit:** ${{ github.sha }}
          **Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')

          > This is an unstable canary build. Use at your own risk.

          ## Install
          \`\`\`bash
          curl -fsSL scarlet.industries/install.sh | bash
          \`\`\`" \
              --prerelease \
              --target ${{ github.sha }} \
              release/*

            # --cleanup-tag moves the `canary` tag too: without it the release
            # below would reuse the old tag, still on the previous canary's commit.
            gh release delete canary --repo ${{ github.repository }} --yes --cleanup-tag 2>/dev/null || true
            gh release create canary \
              --repo ${{ github.repository }} \
              --title "Latest Canary" \
              --notes "This always points to the latest canary build.

          **Current version:** $VERSION

          For a specific version, use \`scarlet upgrade $VERSION\`" \
              --prerelease \
              --target ${{ github.sha }} \
              release/*
          else
            # This version's entry in CHANGELOG.md, which knope wrote from the
            # change files: from its heading up to the next release's.
            CHANGES=$(awk -v v="$VERSION" '$0 ~ "^## " v " " { on = 1; next } /^## / && on { exit } on' CHANGELOG.md)
            gh release create "$TAG" \
              --repo ${{ github.repository }} \
              --title "v$VERSION" \
              --notes "## Install
          \`\`\`bash
          curl -fsSL scarlet.industries/install.sh | bash
          \`\`\`

          ## Changelog
          $CHANGES" \
              release/*
          fi
